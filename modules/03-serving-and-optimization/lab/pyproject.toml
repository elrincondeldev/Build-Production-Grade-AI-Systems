[project]
name = "kestrel-serving"
version = "0.3.0"
description = "Module 3 lab: benchmark, cache, quantize and cost out the Kestrel Pay docs-assistant"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "structlog>=24.1",
]

[project.optional-dependencies]
# ONNX export + ONNX Runtime benchmark (lesson 3.7). Install with: uv sync --extra onnx
onnx = ["skl2onnx>=1.16", "onnx>=1.15", "onnxruntime>=1.17"]
# Real sentence embeddings for the semantic cache (lesson 3.5). Downloads ~90 MB + torch.
st = ["sentence-transformers>=2.6"]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kestrel_serving"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["scripts"]

global:
  scrape_interval: 5s        # short for the lab; 15–60 s is typical in production
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert_rules.yml

scrape_configs:
  - job_name: docs-assistant
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8000"]

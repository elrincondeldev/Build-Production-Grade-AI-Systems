[project]
name = "kestrel-lab4-evals"
version = "0.4.0"
description = "Module 4 lab: eval gates, calibration, dashboards and drift detection for Kestrel Pay"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "rank-bm25>=0.2.2",
    "prometheus-client>=0.20",
    "opentelemetry-api>=1.24",
    "opentelemetry-sdk>=1.24",
    "joblib>=1.6.0",
]

[project.optional-dependencies]
# Send traces to an OpenTelemetry collector / Jaeger / Tempo instead of the console.
otlp = ["opentelemetry-exporter-otlp-proto-http>=1.24"]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kestrel_docs", "src/kestrel_fraud"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# "." lets tests import the evals/ and scripts/ folders as packages.
pythonpath = [".", "src"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore:Using .httpx.:Warning"]

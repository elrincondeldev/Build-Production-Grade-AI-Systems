# Eval gate for pull requests. 📖 Lesson 4.3 and 4.6.
#
# ⚠️ GitHub only runs workflows stored in .github/workflows/ at the repo root.
# To enable it in YOUR fork:
#     mkdir -p .github/workflows
#     cp modules/04-evaluation-and-monitoring/lab/ci/github-actions-eval-gate.yml .github/workflows/eval-gate.yml
#     git add .github/workflows/eval-gate.yml && git commit -m "ci: add eval gate" && git push
#
# Then open a PR that activates prompt v2 and watch the check go red.
name: eval-gate

on:
  pull_request:
    paths:
      - "modules/04-evaluation-and-monitoring/lab/**"
      - "datasets/**"
  workflow_dispatch: {}

jobs:
  eval-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: modules/04-evaluation-and-monitoring/lab
    env:
      KESTREL_LLM_PROVIDER: fake        # deterministic: same code + same data = same score
      KESTREL_OTEL_EXPORTER: none
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync

      - name: Unit tests
        run: uv run pytest

      - name: Run offline evals
        run: uv run python -m evals.run_evals

      - name: Eval gate (fails the PR on regression)
        run: uv run python scripts/eval_gate.py

      - name: Upload eval results
        if: always()               # keep the evidence even when the gate fails
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: modules/04-evaluation-and-monitoring/lab/results/

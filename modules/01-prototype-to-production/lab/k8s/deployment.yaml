# Preview only: Module 6 deploys this on a local kind cluster with a canary release.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud-service
  labels:
    app.kubernetes.io/name: fraud-service
spec:
  replicas: 2                       # two pods: one can die (or roll out) while the other serves
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0             # never drop below 2 ready pods during a rollout
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fraud-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fraud-service
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      terminationGracePeriodSeconds: 30
      containers:
        - name: fraud-service
          # Pin an immutable tag (or digest), never :latest, so you know exactly what runs.
          image: kestrel/fraud-service:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8001
          envFrom:
            - configMapRef:
                name: fraud-service-config
            - secretRef:
                name: fraud-service-secrets
                optional: true
          resources:
            requests:               # what the scheduler reserves for the pod
              cpu: 250m
              memory: 256Mi
            limits:                 # hard ceiling: exceeding memory gets the pod OOM-killed
              memory: 512Mi
          startupProbe:             # gives slow model loading time before liveness kicks in
            httpGet: { path: /health, port: http }
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:            # "restart me if I'm stuck"
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:           # "don't send me traffic until the model is verified"
            httpGet: { path: /ready, port: http }
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

[project]
name = "kestrel-docs-assistant-secure"
version = "0.5.0"
description = "Module 5 lab: the Kestrel Pay docs-assistant, locked down (auth, RBAC retrieval, guardrails, PII, audit, policy registry)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyjwt>=2.8",
    "httpx>=0.27",
    "structlog>=24.1",
]

[project.optional-dependencies]
# Swap the regex PII redactor for Microsoft Presidio (downloads a spaCy model, ~500 MB).
presidio = ["presidio-analyzer>=2.2", "presidio-anonymizer>=2.2"]
# Fairness audit script for the fraud model (lesson 5.6).
governance = ["scikit-learn>=1.4", "pandas>=2.2"]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kestrel_docs_assistant"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]

[project]
name = "kestrel-module2-lab"
version = "0.1.0"
description = "Module 2 lab: data pipelines, reproducible training and an enterprise RAG pipeline"
requires-python = ">=3.11"
dependencies = [
    # Part A: data and model pipelines
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "mlflow>=3.0",
    "optuna>=3.6",
    # Part B: docs-assistant RAG
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "qdrant-client>=1.10",
    "rank-bm25>=0.2.2",
    "beautifulsoup4>=4.12",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Real semantic embeddings and a cross-encoder reranker (downloads ~100 MB of models + torch)
semantic = ["sentence-transformers>=3.0"]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pipelines", "src/kestrel_docs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning", "ignore::UserWarning"]

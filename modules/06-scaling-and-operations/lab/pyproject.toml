[project]
name = "kestrel-platform"
version = "0.1.0"
description = "Module 6 lab: deploy the Kestrel platform with a canary, a cost report and a supervised agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "structlog>=24.1",
    "httpx>=0.27",
    "prometheus-client>=0.20",
    "numpy>=1.26",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
# Optional: run the same pipeline as a Prefect flow (lesson 6.2). Never needed by tests.
prefect = ["prefect>=3.0"]

[dependency-groups]
dev = ["pytest>=8.0", "pyyaml>=6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kestrel_platform"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
